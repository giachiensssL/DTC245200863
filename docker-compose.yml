# =============================================================================
# docker-compose.yml — TechPro WordPress Product Promotion Website
# Student ID: DTC245200863 | Subject: Software System Deployment & Admin
# =============================================================================

version: '3.8'

# ===========================================================================
# NETWORKS — Isolation between service tiers
# ===========================================================================
networks:
  frontend_net:
    driver: bridge
    name: techpro_frontend
  app_net:
    driver: bridge
    name: techpro_app
  db_net:
    driver: bridge
    name: techpro_db
    internal: true
  monitoring_net:
    driver: bridge
    name: techpro_monitoring

# ===========================================================================
# VOLUMES — Persistent data
# ===========================================================================
volumes:
  mysql_data:
    name: techpro_mysql_data
  wordpress_data:
    name: techpro_wordpress_data
  grafana_data:
    name: techpro_grafana_data
  prometheus_data:
    name: techpro_prometheus_data
  loki_data:
    name: techpro_loki_data

# ===========================================================================
# SERVICES
# ===========================================================================
services:

  # ---------------------------------------------------------------------------
  # NGINX — Reverse Proxy (Public Entry Point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: techpro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
      - wordpress_data:/var/www/html:ro
    networks:
      - frontend_net
      - app_net
      - monitoring_net
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # MYSQL — Database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: techpro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # WORDPRESS — Application (PHP-FPM + Alpine)
  # ---------------------------------------------------------------------------
  wordpress:
    image: wordpress:6.4.3-php8.1-fpm-alpine
    container_name: techpro_wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', 'https://localhost');
        define('WP_SITEURL', 'https://localhost');
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/themes/techpro:/var/www/html/wp-content/themes/techpro:ro
    networks:
      - app_net
      - db_net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # PHPMYADMIN — Database Admin UI
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: techpro_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
    networks:
      - app_net
      - db_net
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: techpro_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:9090:9090"
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # GRAFANA — Dashboards & Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: techpro_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    user: "472:472"
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # CADVISOR — Container Metrics Exporter
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: techpro_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net
    command:
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=35s'
      - '--event_storage_event_limit=default=0'
      - '--event_storage_age_limit=default=0'

  # ---------------------------------------------------------------------------
  # NODE EXPORTER — Host Metrics
  # ---------------------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: techpro_node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.filesystem'
      - '--collector.netdev'
      - '--collector.loadavg'
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring_net
    pid: host
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # NGINX EXPORTER — Nginx Metrics
  # ---------------------------------------------------------------------------
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: techpro_nginx_exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://nginx:8081/stub_status'
    networks:
      - monitoring_net
      - frontend_net
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # MYSQL EXPORTER — MySQL Metrics
  # ---------------------------------------------------------------------------
  mysql_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: techpro_mysql_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER}:${MYSQL_EXPORTER_PASSWORD}@(mysql:3306)/"
    networks:
      - monitoring_net
      - db_net
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # LOKI — Log Storage & Query Engine
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: techpro_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:3100:3100"
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # PROMTAIL — Log Collector (EOL - used per academic requirement)
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    container_name: techpro_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./nginx/logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring_net
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
